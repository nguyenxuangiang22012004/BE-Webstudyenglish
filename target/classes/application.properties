# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api}

# Tự động nạp file application-local.properties nếu có (khi chạy ở local)
spring.config.import=optional:classpath:application-local.properties



# PostgreSQL Database Configuration (Neon Cloud DB as fallback for Render/Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-old-bird-b3sbga0g-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_svzjQOo1Mi8I}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Application Name
spring.application.name=english-learning-api

# Flyway Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:537126281362-c176dp1e8pss19m34u3tbm83asg0dht5.apps.googleusercontent.com}