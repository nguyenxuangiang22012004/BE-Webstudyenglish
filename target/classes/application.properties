# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# PostgreSQL Database Configuration (Neon PostgreSQL Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-old-bird-b3sbga0g-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_svzjQOo1Mi8I}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Application Name
spring.application.name=english-learning-api

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

